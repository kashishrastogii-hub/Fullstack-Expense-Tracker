# Production profile: SPRING_PROFILES_ACTIVE=prod
# All secrets must come from the environment; see README "Deployment".

# Never let Hibernate modify a production schema. Flyway owns it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# The SPA is served by this same application, so no cross-origin access is needed.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Fail fast at startup if mail cannot actually be delivered (see ProductionConfigValidator)
app.mail.mode=${MAIL_MODE:smtp}

server.forward-headers-strategy=framework
server.tomcat.threads.max=${SERVER_MAX_THREADS:50}
server.shutdown=graceful

# Managed MySQL (Aiven, PlanetScale, ...) usually caps concurrent connections
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

spring.flyway.clean-disabled=true

logging.level.root=INFO
logging.level.com.fullStack.expenseTracker=INFO
logging.level.org.hibernate.SQL=WARN
