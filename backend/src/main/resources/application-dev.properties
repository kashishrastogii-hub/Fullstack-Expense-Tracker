# Local development overrides (active by default)
spring.jpa.hibernate.ddl-auto=update

# Allow the create-react-app dev server
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# auto = send if MAIL_USERNAME/MAIL_PASSWORD are set, otherwise log the email to the console
app.mail.mode=${MAIL_MODE:auto}

logging.level.com.fullStack.expenseTracker=INFO
