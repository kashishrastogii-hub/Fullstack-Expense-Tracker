spring.main.allow-circular-references=true

# Load backend/.env if present (plain KEY=VALUE file, optional)
spring.config.import=optional:file:.env[.properties]

# Default to the dev profile locally; production sets SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

server.port=${PORT:8080}
server.error.include-message=always

spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/expense_tracker}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

app.jwtSecret=${JWT_SECRET:======================expense=tracker=pocketwise===========================}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# CORS: comma-separated list. Leave empty when the SPA and API share an origin.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Mail
# MAIL_MODE: auto | console | smtp
#   auto    -> smtp when credentials are present, otherwise logs the email to the console
#   console -> never sends, always logs (development only)
#   smtp    -> always sends, propagates failures
app.mail.mode=${MAIL_MODE:auto}
app.mail.from=${MAIL_FROM:}
app.mail.sender-name=${MAIL_SENDER_NAME:PocketWise}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS:true}

app.verificationCodeExpirationMs=${VERIFICATION_CODE_EXPIRATION_MS:900000}

app.user.profile.upload.dir=${USER_PROFILE_UPLOAD_DIR:./uploads/user/profile}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
# Never tie the health endpoint (and therefore the platform's restarts) to the
# availability of the external mail provider. Delivery problems surface on the
# registration request instead.
management.health.mail.enabled=false

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
