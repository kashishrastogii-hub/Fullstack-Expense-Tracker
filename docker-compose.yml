# Local all-in-one demo: MySQL + the Spring Boot app with the React SPA bundled in.
#
#   docker compose up --build
#   open http://localhost:8080
#
# Verification emails are not sent in this mode: the code is printed in the app log,
# e.g. `docker compose logs app` (MAIL_MODE=console). To send real email, see the
# "Mail" section of the README.
#
# Production deployments do not use this file: Render builds the Dockerfile directly
# and supplies its own environment variables (SPRING_PROFILES_ACTIVE=prod).

services:
  db:
    image: mysql:8.0
    container_name: pocketwise-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-expense_tracker}
    ports:
      # Host 3307 so a locally installed MySQL on 3306 keeps working.
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: pocketwise-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Local demo profile: Hibernate creates/updates tables and mail is logged, not sent.
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://db:3306/${DB_NAME:-expense_tracker}?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      MAIL_MODE: console
      # Demo-only secret (public in this repo). Override it in a local .env file.
      # Production refuses to start with this value.
      JWT_SECRET: ${JWT_SECRET:-MyynTIuydhO7wq+kP38tmGEf0dxawxCURkVc36dfqFjuRVW7+BwYc8lR00QkaA3l}
      USER_PROFILE_UPLOAD_DIR: /app/uploads/user/profile
      CORS_ALLOWED_ORIGINS: http://localhost:8080
    volumes:
      - uploads:/app/uploads

volumes:
  db_data:
  uploads:
